<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>Practice lifecycle test</title></head>
  <body>
    <div id="fixture"></div>
    <script type="module">
      import { mount, unmount } from 'svelte';
      import PracticePanel from '../../src/lib/components/PracticePanel.svelte';
      import { DEFAULT_SETTINGS } from '../../src/lib/typing/exercise-generator';
      import '../../src/app.css';

      const component = mount(PracticePanel, {
        target: document.getElementById('fixture'),
        props: { settings: { ...DEFAULT_SETTINGS, mode: 'words' } }
      });
      window.addEventListener('unmount-practice', () => unmount(component), { once: true });
    </script>
  </body>
</html>
